name: Build & Push Docker Images

on:
  push:
    branches:
      - backend-prod
      - frontend-prod
      - admin-prod

  pull_request:
    branches:
      - backend-prod
      - frontend-prod
      - admin-prod

  workflow_dispatch:
    inputs:
      target:
        description: "Select build target"
        required: true
        type: choice
        options:
          - backend-prod
          - frontend-prod
          - admin-prod

jobs:
  docker:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.target || github.ref_name }}

      - name: Docker Hub Login
        uses: docker/login-action@v3
        with:
          username: guru874
          password: ${{ secrets.DOCKER_HUB_TOKEN }}

      # --------------------------------------------------
      # BACKEND
      # --------------------------------------------------

      - name: Build & Push Backend
        if: |
          github.ref_name == 'backend-prod' ||
          inputs.target == 'backend-prod'
        uses: docker/build-push-action@v6
        with:
          context: ./rise-bet-backend
          file: ./rise-bet-backend/Dockerfile
          push: true
          tags: |
            guru874/risebet-backend:latest
            guru874/risebet-backend:${{ github.sha }}

      # --------------------------------------------------
      # FRONTEND
      # --------------------------------------------------

      - name: Build & Push Frontend
        if: |
          github.ref_name == 'frontend-prod' ||
          inputs.target == 'frontend-prod'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./DOCKERFILE
          push: true
          build-args: |
            NEXT_PUBLIC_API_BASE_URL=${{ vars.NEXT_PUBLIC_API_BASE_URL }}
            NEXT_PUBLIC_WS_URL=${{ vars.NEXT_PUBLIC_WS_URL }}
          tags: |
            guru874/risebet-frontend:latest
            guru874/risebet-frontend:${{ github.sha }}

      # --------------------------------------------------
      # ADMIN
      # --------------------------------------------------

      - name: Build & Push Admin
        if: |
          github.ref_name == 'admin-prod' ||
          inputs.target == 'admin-prod'
        uses: docker/build-push-action@v6
        with:
          context: ./admin
          file: ./admin/Dockerfile
          push: true
          build-args: |
            NEXT_PUBLIC_API_BASE_URL=${{ vars.NEXT_PUBLIC_API_BASE_URL }}
            NEXT_PUBLIC_WS_URL=${{ vars.NEXT_PUBLIC_WS_URL }}
          tags: |
            guru874/risebet-admin:latest
            guru874/risebet-admin:${{ github.sha }}
