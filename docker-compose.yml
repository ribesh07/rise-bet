version: '3.8'

services:
  # RiseBet Frontend - user-facing casino platform running on port 3044
  risebet-frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: risebet-frontend
    restart: unless-stopped
    ports:
      - "3044:3044"
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_API_BASE_URL=${NEXT_PUBLIC_API_BASE_URL}
      - NEXT_PUBLIC_WS_URL=${NEXT_PUBLIC_WS_URL}
    networks:
      - risebet-net
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3044/"]
      interval: 30s
      timeout: 10s
      retries: 3

  # RiseBet Admin - internal admin dashboard running on port 3045 (requires login)
  risebet-admin:
    build:
      context: ./admin
      dockerfile: Dockerfile
    container_name: risebet-admin
    restart: unless-stopped
    ports:
      - "3045:3045"
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_API_BASE_URL=${NEXT_PUBLIC_API_BASE_URL}
      - NEXT_PUBLIC_WS_URL=${NEXT_PUBLIC_WS_URL}
    networks:
      - risebet-net
    depends_on:
      - risebet-frontend
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3045/login"]
      interval: 30s
      timeout: 10s
      retries: 3

