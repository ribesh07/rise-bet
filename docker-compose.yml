# version: "3.8"

x-common: &common
  restart: unless-stopped
  networks:
    - risebet-net

services:

  # ============================================================
  # RISEBET BACKEND
  # ============================================================

  risebet-backend:
    <<: *common

    image: guru874/risebet-backend:latest

    container_name: risebet-backend

    labels:
      - traefik.enable=true
      # ADD THIS LINE:
      - traefik.http.services.wm5tm7ugdm5sdd7es25jrza0-risebet-backend.loadbalancer.server.port=3084

    environment:
      NODE_ENV: production
      PORT: 3084

      # PostgreSQL
      DATABASE_URL: ${DATABASE_URL}

      # JWT
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-30d}

      # Redis
      REDIS_URL: ${REDIS_URL}

      # SMTP / Zoho
      SMTP_HOST: ${SMTP_HOST:-smtp.zoho.com}
      SMTP_PORT: ${SMTP_PORT:-465}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASS: ${SMTP_PASS}
      SMTP_SECURE: ${SMTP_SECURE:-true}
      MAIL_FROM: ${MAIL_FROM}

      # Public backend URL
      BACKEND_BASE_URL: ${BACKEND_PUBLIC_URL}

      # Public API / WebSocket
      NEXT_PUBLIC_API_BASE_URL: ${BACKEND_PUBLIC_URL}
      NEXT_PUBLIC_WS_URL: ${WS_PUBLIC_URL}

    ports:
      - "3084:3084"

    volumes:
      - risebet_uploads:/app/uploads

    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--no-verbose",
          "--tries=1",
          "--spider",
          "http://localhost:3084/"
        ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 45s


  # ============================================================
  # RISEBET FRONTEND
  # ============================================================

  risebet-frontend:
    <<: *common

    image: guru874/risebet-frontend:latest

    container_name: risebet-frontend

    labels:
      - traefik.enable=true
      # ADD THIS LINE:
      - traefik.http.services.wm5tm7ugdm5sdd7es25jrza0-risebet-frontend.loadbalancer.server.port=3044

    environment:
      NODE_ENV: production

      # Server-side communication
      BACKEND_INTERNAL_URL: http://risebet-backend:3084
      NEXT_PUBLIC_API_BASE_URL: 'https://api.playrise.vip'
      NEXT_PUBLIC_WS_URL: 'wss://api.playrise.vip'

    depends_on:
      risebet-backend:
        condition: service_healthy

    ports:
      - "3044:3044"

    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--no-verbose",
          "--tries=1",
          "--spider",
          "http://localhost:3044/"
        ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s


  # ============================================================
  # RISEBET ADMIN
  # ============================================================

  risebet-admin:
    <<: *common

    image: guru874/risebet-admin:latest

    container_name: risebet-admin

    labels:
      - traefik.enable=true
      # ADD THIS LINE:
      - traefik.http.services.wm5tm7ugdm5sdd7es25jrza0-risebet-admin.loadbalancer.server.port=3045

    environment:
      NODE_ENV: production

      # Server-side communication
      BACKEND_INTERNAL_URL: http://risebet-backend:3084
      NEXT_PUBLIC_API_BASE_URL: 'https://api.playrise.vip'
      NEXT_PUBLIC_WS_URL: 'wss://api.playrise.vip'

    depends_on:
      risebet-backend:
        condition: service_healthy

    ports:
      - "3045:3045"

    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--no-verbose",
          "--tries=1",
          "--spider",
          "http://localhost:3045/login"
        ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s


# ==============================================================
# NETWORK
# ==============================================================

networks:
  risebet-net:
    driver: bridge


# ==============================================================
# PERSISTENT STORAGE
# ==============================================================

volumes:

  # Backend uploaded files
  risebet_uploads:
    driver: local